name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Write mobile .env if secrets provided
        working-directory: mobile
        env:
          API_URL: ${{ secrets.API_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cat <<EOF > .env
          API_URL=${API_URL:-http://10.0.2.2:4000/api}
          SOCKET_URL=${SOCKET_URL:-http://10.0.2.2:4000}
          GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
          EOF

      - name: Decode release keystore if provided
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/fleetpulse-release.keystore
            cat <<EOF > keystore.properties
          MYAPP_UPLOAD_STORE_FILE=fleetpulse-release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          MYAPP_UPLOAD_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF
          elif [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build Release APK & Play Store AAB
        working-directory: mobile/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetpulse-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetpulse-playstore-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
